# Publish Voluta NuGet packages on a v*.*.* tag (or an opted-in workflow_dispatch).
# Also packs product docs into docs.tgz and attaches it to the GitHub Release
# so docs.stbl.space can pull without duplicating markdown elsewhere.
#
# Push credentials, honestly:
#   - DEFAULT: API key push via secrets.NUGET_API_KEY (dotnet nuget push --api-key).
#   - OPTIONAL: OIDC trusted publishing (nuget/login@v1) only behind the repository
#     variable NUGET_OIDC == 'true' (see docs/0.x/nuget-trusted-publisher.md).
#   - workflow_dispatch with dry_run=false now pushes too (same credential branches);
#     dry_run=true never pushes. Tag pushes remain the canonical release path.
#   - On tag events the package versions are verified against the tag BEFORE any push
#     (a v0.5.1 tag publishing 0.5.0 packages exits 1).

name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack only, do not push (sanity check). dry_run=false DOES push."
        required: false
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: nuget
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: pack docs.tgz
        run: |
          set -euo pipefail
          test -f docs/product.md
          test -n "$(find docs -type f \( -name '*.mdx' -o -name '*.md' \) ! -path 'docs/product.md' | head -1)"
          tar -czf "${RUNNER_TEMP}/docs.tgz" -C docs .
          echo "docs.tgz contents:"
          tar -tzf "${RUNNER_TEMP}/docs.tgz"
          ls -la "${RUNNER_TEMP}/docs.tgz"

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: |
            **/voluta.slnx
            **/Directory.Build.props
            **/Directory.Packages.props
            **/*.csproj

      - name: restore
        run: dotnet restore voluta.slnx --nologo

      - name: build (Release)
        run: dotnet build voluta.slnx -c Release --nologo

      - name: pack
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          mkdir -p "$pack_out"
          packable_projects=(
            src/agents/Voluta.Agents.AI/Voluta.Agents.AI.csproj
            src/checkpoints/Voluta.Checkpoints.EntityFrameworkCore/Voluta.Checkpoints.EntityFrameworkCore.csproj
            src/checkpoints/Voluta.Checkpoints.File/Voluta.Checkpoints.File.csproj
            src/checkpoints/Voluta.Checkpoints.Redis/Voluta.Checkpoints.Redis.csproj
            src/checkpoints/Voluta.Checkpoints.S3/Voluta.Checkpoints.S3.csproj
            src/core/Voluta.Abstractions/Voluta.Abstractions.csproj
            src/core/Voluta.DependencyInjection/Voluta.DependencyInjection.csproj
            src/core/Voluta/Voluta.csproj
            src/devtools/Voluta.Generators/Voluta.Generators.csproj
            src/hosting/Voluta.Hosting/Voluta.Hosting.csproj
            src/hosting/Voluta.OpenTelemetry/Voluta.OpenTelemetry.csproj
            src/ops/Voluta.UI/Voluta.UI.csproj
          )
          for proj in "${packable_projects[@]}"; do
            name="$(basename "$proj" .csproj)"
            echo "packing $proj"
            # Analyzer package: no symbols; library packages get snupkg.
            if [ "$name" = "Voluta.Generators" ]; then
              dotnet pack "$proj" -c Release \
                --no-build \
                -p:IncludeSymbols=false \
                --output "$pack_out"
            else
              dotnet pack "$proj" -c Release \
                --no-build \
                --include-symbols \
                --include-source \
                -p:SymbolPackageFormat=snupkg \
                --output "$pack_out"
            fi
          done
          # Template pack (content only — no assembly / symbols).
          echo "packing templates/Voluta.Templates"
          dotnet pack templates/Voluta.Templates/Voluta.Templates.csproj -c Release \
            -p:IncludeSymbols=false \
            --output "$pack_out"
          ls -la "$pack_out"
          # Core + Generators must exist (any version). Voluta.Testing is IsPackable=false.
          test -n "$(ls -1 "$pack_out"/Voluta.[0-9]*.nupkg 2>/dev/null | grep -E '^'"$pack_out"'/Voluta\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg$' || true)"
          core_nupkg="$(find "$pack_out" -maxdepth 1 -regextype posix-extended -regex '.*/Voluta\.[0-9]+\.[0-9]+\.[0-9]+\.nupkg' | head -1)"
          gen_nupkg="$(find "$pack_out" -maxdepth 1 -name 'Voluta.Generators.*.nupkg' | head -1)"
          templates_nupkg="$(find "$pack_out" -maxdepth 1 -name 'Voluta.Templates.*.nupkg' | head -1)"
          test -n "$core_nupkg"
          test -n "$gen_nupkg"
          test -n "$templates_nupkg"
          echo "core=$core_nupkg gen=$gen_nupkg templates=$templates_nupkg"

      # Footgun guard (v050): a v0.5.1 tag that built 0.5.0 packages must fail BEFORE
      # any push. Applies to tag events only — dispatch publishes whatever
      # Directory.Build.props declares.
      - name: verify tag vs packages
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          pack_out="${RUNNER_TEMP}/packages"
          mismatch=0
          for nupkg in "$pack_out"/*.nupkg; do
            [ -e "$nupkg" ] || continue
            version="$(basename "$nupkg" | sed -E 's/.*\.([0-9]+\.[0-9]+\.[0-9]+)(-.*)?\.nupkg$/\1\2/')"
            if [ "$version" != "$expected" ]; then
              echo "VERSION MISMATCH: $(basename "$nupkg") is '$version', tag expects '$expected'"
              mismatch=1
            fi
          done
          if [ "$mismatch" -ne 0 ]; then
            echo "Tag/package version verification failed — refusing to push."
            exit 1
          fi
          echo "All package versions match tag $GITHUB_REF_NAME (v$expected)."

      # Credential branches are mutually exclusive:
      #   OIDC trusted publishing only behind vars.NUGET_OIDC == 'true'
      #   (requires secret NUGET_USER = nuget.org account name — see
      #   docs/0.x/nuget-trusted-publisher.md); API-key push stays the default path.
      # push-or-opted-dispatch = tag push, or a dispatch run that asked to push
      # (inputs.dry_run == false).
      - name: NuGet OIDC login
        if: vars.NUGET_OIDC == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: push to nuget.org (OIDC trusted publishing)
        if: vars.NUGET_OIDC == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          dotnet nuget push "$pack_out/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
          if ls "$pack_out"/*.snupkg >/dev/null 2>&1; then
            dotnet nuget push "$pack_out/*.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --skip-duplicate
          fi

      - name: push to nuget.org (API key)
        if: vars.NUGET_OIDC != 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false))
        run: |
          set -euo pipefail
          pack_out="${RUNNER_TEMP}/packages"
          dotnet nuget push "$pack_out/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --skip-duplicate
          if ls "$pack_out"/*.snupkg >/dev/null 2>&1; then
            dotnet nuget push "$pack_out/*.snupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "${{ secrets.NUGET_API_KEY }}" \
              --skip-duplicate
          fi

      # Release notes from CHANGELOG.md (v050): extract the tagged version's section;
      # fall back to generated notes when the section is missing (never fail a release
      # on a doc miss).
      - name: release notes from changelog
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/notes.md"
          if test -f CHANGELOG.md \
            && awk -v ver="$expected" '
              BEGIN { found = 0 }
              /^## \[/ {
                if (found) { exit }
                if (index($0, "## [" ver "]") == 1) { found = 1; next }
              }
              found { print }
            ' CHANGELOG.md > "$notes" \
            && test -s "$notes"; then
            echo "Release notes extracted from CHANGELOG.md for $expected."
          else
            echo "No CHANGELOG.md section for $expected — falling back to --generate-notes."
            rm -f "$notes"
            echo "$GITHUB_REF_NAME" > "${RUNNER_TEMP}/notes-mode"
          fi
          if test -s "$notes"; then
            echo "notes-file" > "${RUNNER_TEMP}/notes-mode"
          fi

      - name: upload docs.tgz to GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes="${RUNNER_TEMP}/notes.md"
          mode="$(cat "${RUNNER_TEMP}/notes-mode" 2>/dev/null || echo generated)"
          if [ "$mode" = "notes-file" ] && [ -s "$notes" ]; then
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --notes-file "$notes" --verify-tag
            fi
          else
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --generate-notes --verify-tag
            fi
          fi
          gh release upload "$tag" "${RUNNER_TEMP}/docs.tgz" --clobber

      # Optional: rebuild docs.stbl.space after docs.tgz is on the release.
      # Secret DOCS_DISPATCH_TOKEN = PAT/fine-grained with repo scope on
      # dot-stbl/vironima.internal. If unset, skip — docs CI still runs on
      # lock file bumps. Note: secrets cannot be used in `if:` expressions
      # (Actions rejects the workflow); gate inside the step instead.
      - name: dispatch docs site rebuild
        if: github.event_name == 'push'
        env:
          DOCS_DISPATCH_TOKEN: ${{ secrets.DOCS_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DOCS_DISPATCH_TOKEN}" ]; then
            echo "DOCS_DISPATCH_TOKEN not set — skip docs site dispatch"
            exit 0
          fi
          GH_TOKEN="${DOCS_DISPATCH_TOKEN}" gh api repos/dot-stbl/vironima.internal/dispatches \
            -f event_type=product-docs-published \
            -f "client_payload[product]=voluta" \
            -f "client_payload[tag]=${GITHUB_REF_NAME}" \
            -f "client_payload[repo]=dot-stbl/voluta" \
            -f "client_payload[asset]=docs.tgz"
          echo "dispatched product-docs-published → vironima.internal"

      - name: dry-run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: |
          echo "Dry run — packages packed but NOT pushed; docs.tgz packed but NOT uploaded:"
          ls -la "${RUNNER_TEMP}/packages"
          echo "--- docs.tgz ---"
          ls -la "${RUNNER_TEMP}/docs.tgz"
          tar -tzf "${RUNNER_TEMP}/docs.tgz"
